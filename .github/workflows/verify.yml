name: Research checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python-and-host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -c requirements-gh200.txt -e '.[test,research,dev]' cmake==3.31.10
      - run: sudo apt-get update -qq && sudo apt-get install -y clang-format
      - run: make lint PYTHON=python RUFF=ruff
      - run: OPENBLAS_NUM_THREADS=1 python -m pytest -q
      - run: python scripts/check_source.py && python scripts/check_docs.py
      - run: |
          python scripts/make_fixture.py /tmp/cmk-fixture.bin
          python scripts/make_imported_fixture.py /tmp/cmk-imported.txt
          cmake -S kernels -B build/host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host -j2
          build/host/cmk_host_check /tmp/cmk-fixture.bin
          build/host/cmk_imported_check /tmp/cmk-imported.txt
  lean:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.24.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: bash scripts/check_lean.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-build-and-axiom-audit
          path: |
            results/lean-build.log
            results/lean-axioms.log
            results/lean-verification.json
          if-no-files-found: ignore
