name: Source validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: OPENBLAS_NUM_THREADS=1 python -m pytest -q
      - run: |
          python scripts/make_fixture.py /tmp/cmk-fixture.bin
          python scripts/make_imported_fixture.py /tmp/cmk-imported.txt
          cmake -S kernels -B build/host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host -j2
          build/host/cmk_host_check /tmp/cmk-fixture.bin
          build/host/cmk_imported_check /tmp/cmk-imported.txt
      - run: python scripts/check_source.py
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan; project toolchain is pinned in lean/lean-toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: bash scripts/check_lean.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-axiom-audit
          path: results/lean-axioms.log
          if-no-files-found: ignore
# No self-hosted GPU job: do not run untrusted PR code on a private GH200.
