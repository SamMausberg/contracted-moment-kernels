[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contracted-moment-kernels"
version = "0.1.0"
description = "Research on moment summaries and observation-directed reduction certificates"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = ["pytest>=7", "mpmath>=1.3"]
research = ["matplotlib>=3.8", "markdown-it-py>=3", "mdit-py-plugins>=0.4"]
traces = ["transformers==4.51.3", "accelerate==1.6.0"]

[tool.setuptools]
packages = ["cmk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
